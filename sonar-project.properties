sonar.projectKey=stayora
sonar.projectName=Stayora
sonar.projectVersion=0.0.1
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src/main/java,backend/src/main/resources,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**/*.java,frontend/src/**/*.spec.ts
sonar.exclusions=frontend/src/**/*.spec.ts
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/sonar-libraries/*.jar
sonar.java.test.libraries=backend/target/sonar-libraries/*.jar
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json,frontend/tsconfig.spec.json
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/stayora/lcov.info
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.scanner.skipJreProvisioning=true
# Generated files, vendor code and docs are outside the source directories above.
# Production code has no coverage or issue exclusions.
