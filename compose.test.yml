services:
  postgres-test:
    image: postgres:18
    ports: ['127.0.0.1:5433:5432']
    environment:
      POSTGRES_DB: stayora_test
      POSTGRES_USER: stayora
      POSTGRES_PASSWORD: stayora
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stayora -d stayora_test']
      interval: 3s
      timeout: 3s
      retries: 20
