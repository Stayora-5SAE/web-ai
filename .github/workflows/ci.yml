name: Verify Stayora
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run test:coverage && npm run build
        working-directory: frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/stayora/
          if-no-files-found: warn
          retention-days: 14
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stayora_test
          POSTGRES_USER: stayora
          POSTGRES_PASSWORD: stayora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stayora -d stayora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/stayora_test
      TEST_DB_USERNAME: stayora
      TEST_DB_PASSWORD: stayora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: bash mvnw -B clean verify -Pcoverage spotless:check dependency:copy-dependencies -DoutputDirectory=target/sonar-libraries
        working-directory: backend
      - name: Upload backend coverage and analysis inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-and-analysis-inputs
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/classes/
            backend/target/test-classes/
            backend/target/sonar-libraries/
          if-no-files-found: warn
          retention-days: 14
  sonar-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run sonar:test
